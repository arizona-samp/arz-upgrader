<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARIZONA UPGRADER</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">🎃</div>

        <div>
            <div class="logo-title">ARIZONA</div>
            <div class="logo-subtitle">UPGRADER</div>
        </div>
    </div>

    <div class="online">
        <span class="online-dot"></span>
        ONLINE:
        <span id="online">320</span>
    </div>
</header>


<main class="container">

    <div class="categories">

        <button class="type-btn active" data-type="virtual" type="button">
            <span>💰</span>
            <b>Виртуальная валюта</b>
        </button>

        <button class="type-btn" data-type="vehicle" type="button">
            <span>🚗</span>
            <b>Машина</b>
        </button>

        <button class="type-btn" data-type="property" type="button">
            <span>🏠</span>
            <b>Имущество</b>
        </button>

        <button class="type-btn" data-type="item" type="button">
            <span>🎁</span>
            <b>Предмет</b>
        </button>

    </div>


    <section class="upgrade-area">

        <!-- SOURCE -->

        <div class="item-card">

            <div class="card-label">
                ВАША СТАВКА
            </div>

            <button class="item-button" id="changeSource" type="button">

                <div class="item-icon" id="sourceIcon">
                    💰
                </div>

                <div class="item-info">
                    <div class="item-name" id="sourceName">
                        Виртуальная валюта
                    </div>

                    <div class="item-price" id="sourcePrice">
                        $1 000 000
                    </div>
                </div>

                <div class="change-arrow">
                    ›
                </div>

            </button>


            <div class="virtual-input" id="virtualBox">

                <div class="input-label">
                    Сумма ставки
                </div>

                <div class="input-wrapper">

                    <span>$</span>

                    <input
                        id="virtualAmount"
                        type="number"
                        min="1"
                        value="1000000"
                        placeholder="Введите сумму"
                    >

                </div>

            </div>

        </div>


        <!-- CENTER -->

        <div class="upgrade-center">

            <div class="chance-title">
                ШАНС
            </div>

            <div class="multiplier" id="multiplier">
                x1.96
            </div>

            <div class="chance-value" id="chanceValue">
                50%
            </div>


            <div class="chance-buttons">

                <button class="chance-btn" data-chance="5" type="button">
                    5%
                </button>

                <button class="chance-btn" data-chance="15" type="button">
                    15%
                </button>

                <button class="chance-btn" data-chance="30" type="button">
                    30%
                </button>

                <button class="chance-btn active" data-chance="50" type="button">
                    50%
                </button>

                <button class="chance-btn" data-chance="75" type="button">
                    75%
                </button>

            </div>


            <button class="upgrade-button" id="upgradeButton" type="button">
                УЛУЧШИТЬ
            </button>

        </div>


        <!-- TARGET -->

        <div class="item-card">

            <div class="card-label">
                ВЫ ПОЛУЧИТЕ
            </div>

            <button class="item-button" id="changeTarget" type="button">

                <div class="item-icon" id="targetIcon">
                    💰
                </div>

                <div class="item-info">

                    <div class="item-name" id="targetName">
                        Виртуальная валюта
                    </div>

                    <div class="item-price" id="targetPrice">
                        $1 960 000
                    </div>

                </div>

                <div class="change-arrow">
                    ›
                </div>

            </button>

        </div>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">
            <span>ПОПЫТКИ</span>
            <b id="attempts">0</b>
        </div>

        <div class="stat">
            <span>ПОБЕДЫ</span>
            <b id="wins">0</b>
        </div>

        <div class="stat">
            <span>ПОРАЖЕНИЯ</span>
            <b id="losses">0</b>
        </div>

        <div class="stat">
            <span>WINRATE</span>
            <b id="winrate">0%</b>
        </div>

    </section>

</main>


<!-- MODAL -->

<div class="modal-overlay" id="modalOverlay">

    <div class="modal" id="selectionModal">

        <div class="modal-header">

            <div class="modal-title" id="modalTitle">
                Выберите предмет
            </div>

            <button id="modalClose" type="button">
                ×
            </button>

        </div>

        <div class="modal-list" id="modalList"></div>

    </div>

</div>


<!-- RESULT -->

<div class="result-overlay" id="result">

    <div class="result-box">

        <div class="result-icon" id="resultIcon">
            🎃
        </div>

        <div class="result-title" id="resultTitle">
            ВЫИГРЫШ
        </div>

        <div class="result-text" id="resultText">
            Поздравляем!
        </div>

        <button id="closeResult" type="button">
            ПРОДОЛЖИТЬ
        </button>

    </div>

</div>


<footer>

    <div>
        Создатель Vladislav_Lyashov |
        Игра возможна только с сервера Love
    </div>

    <strong>
        ARIZONA UPGRADER
    </strong>

</footer>


<script src="script.js"></script>

</body>
</html>
